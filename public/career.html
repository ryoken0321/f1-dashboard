<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 ドライバー検索 & キャリア比較</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="stripe"></div>
  <div class="checker"></div>

  <div class="container">
    <header>
      <p class="eyebrow">DRIVER SEARCH · CAREER 2000 — 2026</p>
      <h1><span class="red">F1</span> ドライバー検索 &amp; キャリア比較</h1>
      <p class="subtitle">名前で検索 → 年別ポイントの推移を重ね描き（世代を超えた比較）／ データ: Jolpica (Ergast) API</p>
    </header>

    <nav class="tabs">
      <a href="index.html">ランキング</a>
      <a href="constructors.html">チーム</a>
      <a href="trend.html">推移</a>
      <a href="gap.html">追い上げ</a>
      <a href="laps.html">レース展開</a>
      <a href="career.html" class="active">検索・比較</a>
      <a href="legends.html">歴代</a>
      <a href="analysis.html">分析</a>
    </nav>

    <div class="toolbar">
      <div class="ctrl">
        <label for="nameInput">Driver</label>
        <input id="nameInput" list="driverList" placeholder="例: Hamilton / Schum / верстаппен…" autocomplete="off">
        <datalist id="driverList"></datalist>
      </div>
      <button id="addBtn" type="button">＋ 追加</button>
      <button id="clearBtn" type="button">クリア</button>
    </div>

    <div id="chips" class="chips"></div>
    <p id="status" class="status hidden"></p>

    <div class="card">
      <p class="card-title">Career Points by Year</p>
      <div class="chart-wrap tall"><canvas id="myChart"></canvas></div>
    </div>

    <footer>
      Source: <span class="red">Jolpica / Ergast API</span>（オープンデータ）<br>
      自由入力 → PHPのプリペアドステートメント(LIKE)で安全に検索
    </footer>
  </div>

  <script src="js/teamdata.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/common.js"></script>
  <script src="js/career.js"></script>
</body>
</html>
